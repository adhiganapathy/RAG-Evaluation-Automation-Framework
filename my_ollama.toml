[agent]
system_instruction_name = "rag_agent"
tools = ["local_search"]

  [agent.generation_config]
  model = "ollama/gemma2:2b"

[completion]
provider = "litellm"
concurrent_request_limit = 1
fast_llm = "ollama/gemma2:2b" # used inside R2R for `fast` completions, like document summaries

  [completion.generation_config]
  model = "ollama/gemma2:2b"
  temperature = 0.1
  top_p = 1
  max_tokens_to_sample = 512
  stream = false
  add_generation_kwargs = { }

[embedding]
provider = "ollama"
base_model = "nomic-embed-text"
base_dimension = 768
batch_size = 128
add_title_as_prefix = true
concurrent_request_limit = 2

[database]
provider = "postgres"

  [database.graph_creation_settings]
    graph_entity_description_prompt = "graphrag_entity_description"
    entity_types = [] # if empty, all entities are extracted
    relation_types = [] # if empty, all relations are extracted
    fragment_merge_count = 4 # number of fragments to merge into a single extraction
    max_knowledge_relationships = 100
    max_description_input_length = 65536
    generation_config = { model = "ollama/qwen3:4b" } # and other params, model used for relationship extraction
    automatic_deduplication = false

  [database.graph_enrichment_settings]
    community_reports_prompt = "graphrag_community_reports"
    max_summary_input_length = 65536
    generation_config = { model = "ollama/qwen3:4b" } # and other params, model used for node description and graph clustering
    leiden_params = {}

  [database.graph_search_settings]
    generation_config = { model = "ollama/gemma2:2b" }


[orchestration]
provider = "simple"


[ingestion]
chunks_for_document_summary = 16
document_summary_model = "ollama/gemma2:2b"
automatic_extraction = false